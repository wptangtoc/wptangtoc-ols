# ============================================================
# JOB 3: BLACKBOX TESTS (KIỂM THỬ HỘP ĐEN)
# ============================================================
  blackbox-tests:
    name: Kiểm thử BATS Hộp đen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: ⚙️ Cài đặt BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: 🏗️ Giả lập môi trường WPTangToc OLS
        run: |
          # Tạo thư mục và file ảo
          sudo mkdir -p /etc/wptt/vhost
          sudo mkdir -p /etc/wptt/chuyen-huong
          sudo touch /etc/wptt/.wptt.conf
          sudo touch /etc/wptt/core-functions
          sudo touch /etc/wptt/echo-color
          
          sudo chown -R $USER:$USER /etc/wptt
          chmod -R 755 /etc/wptt
          
          # Bơm hàm lõi giả mạo
          cat << 'EOF' > /etc/wptt/core-functions
          #!/bin/bash
          wptt_check_mariadb() { return 0; }
          wptt_check_lsws() { return 0; }
          wptt_die() { echo "WPTT_DIE: $1"; exit 1; }
          _runing() { echo "RUNNING: $1"; }
          _rundone() { echo "DONE: $1"; }
          _runloi() { echo "ERROR: $1"; }
          EOF

      - name: 🧪 Chạy Kiểm thử
        shell: bash
        run: |
          if find tests -type f -name '*.bats' 2>/dev/null | grep -q .; then
            bats tests/
          else
            echo "Không tìm thấy file test (.bats). Bỏ qua."
          fi
