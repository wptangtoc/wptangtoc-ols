name: WPTangToc OLS CI/CD & Security

# Kích hoạt Robot khi sếp đẩy code lên nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # ROBOT 1: QUÉT CÚ PHÁP BASH (SHELLCHECK)
  # -------------------------------------------------------------
  shellcheck:
    name: Quét lỗi cú pháp Bash
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn về máy ảo GitHub
        uses: actions/checkout@v4

      - name: 🔍 Chạy ShellCheck toàn bộ dự án
        env:
          # Bịt mắt ShellCheck với các mã lỗi kinh điển do include file, trên hệ thống github không thể include thư mục /etc/wptt như linux đuợc
          # SC2102 là để làm function huong_dan tính năng của huớng dẫn để nó get dữ liệu không phải làm một hàm thực thi
          SHELLCHECK_OPTS: "-e SC1091 -e SC1090 -e SC2154 -e SC2102"
        run: |
          # 1. Tìm toàn bộ file trong dự án (bỏ qua thư mục ẩn .git)
          # 2. Dùng awk kiểm tra đúng DÒNG ĐẦU TIÊN (NR==1) có chứa Shebang bash/sh không
          # 3. Đưa danh sách file tìm được vào thẳng lò ShellCheck
          find . -type f -not -path '*/\.git/*' -exec awk 'NR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} + | xargs -r shellcheck
        continue-on-error: true

  # -------------------------------------------------------------
  # ROBOT 2: QUÉT BẢO MẬT & LỘ LỌT API KEY (GITLEAKS)
  # -------------------------------------------------------------
  security-scan:
    name: Quét rò rỉ Mật khẩu/API Key
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn về máy ảo GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải toàn bộ lịch sử commit để quét sâu

      - name: 🛡️ Chạy quét Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
