name: WPTangToc OLS CI/CD & Security

# Kích hoạt Robot khi đẩy code hoặc tạo Pull Request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # ROBOT 1: QUÉT CÚ PHÁP BASH & SHELLCHECK (TỐI ƯU TỐC ĐỘ)
  # -------------------------------------------------------------
  bash-syntax-and-shellcheck:
    name: Kiểm tra Cú pháp & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn về máy ảo GitHub
        uses: actions/checkout@v4

      - name: 🛠️ 1. Kiểm tra Cú pháp Bash thuần (bash -n)
        # Quét bằng lõi Bash gốc, bỏ qua các file có đuôi mở rộng (trừ .sh), dừng ngay nếu vỡ cú pháp
        run: |
          find . -type d -name ".git" -prune -o -type f \( -name "*.sh" -o ! -name "*.*" \) -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} + | xargs -r -I {} bash -n {}

      - name: 🔍 2. Chạy ShellCheck phân tích Logic
        env:
          # Bịt mắt ShellCheck với các mã lỗi kinh điển do include file và function text
          SHELLCHECK_OPTS: "-e SC1091 -e SC1090 -e SC2154 -e SC2102 -e SC2211 -e SC2034"
        run: |
          find . -type d -name ".git" -prune -o -type f \( -name "*.sh" -o ! -name "*.*" \) -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} + | xargs -r shellcheck
        continue-on-error: true

  # -------------------------------------------------------------
  # ROBOT 2: QUÉT BẢO MẬT & LỘ LỌT API KEY (GITLEAKS)
  # -------------------------------------------------------------
  security-scan:
    name: Quét rò rỉ Mật khẩu/API Key
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải mã nguồn về máy ảo GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải toàn bộ lịch sử commit để quét sâu

      - name: 🛡️ Chạy quét Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
