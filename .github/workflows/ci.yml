name: WPTangToc OLS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 1h17 sáng giờ VN (UTC+7) chạy tự động

concurrency:
  group: wptangtoc-ols-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
# ============================================================
# JOB 1: KIỂM TRA CÚ PHÁP, CHẤT LƯỢNG CODE & WORKFLOW SECURITY
# ============================================================
  code-quality:
    name: Kiểm tra Cú pháp & ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: 🛠 1. Kiểm tra Cú pháp Bash thuần
        run: |
          find . -type d -name ".git" -prune -o -type f \( -name "*.sh" -o ! -name "*.*" \) -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} + | xargs -r -P "$(nproc)" -I {} bash -n {}

      - name: 🔍 2. Chạy ShellCheck
        shell: bash
        env:
          SHELLCHECK_OPTS: "-e SC1091 -e SC1090 -e SC2154 -e SC2102 -e SC2211 -e SC2034 -e SC2155"
        run: |
          set -Eeuo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck

          mapfile -t FILES < <(
            find . -type d -name ".git" -prune -o -type f \
              \( -name "*.sh" -o ! -name "*.*" \) \
              -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} +
          )

          if (( ${#FILES[@]} == 0 )); then
            echo "Không tìm thấy file shell nào."
            exit 0
          fi

          echo "::group::📋 Toàn bộ issue (warning + error)"
          printf '%s\0' "${FILES[@]}" | xargs -0 -r -P "$(nproc)" -n 1 shellcheck --severity=warning --format=gcc || true
          echo "::endgroup::"

          echo "::group::🚨 Chỉ ERROR (dùng để gate CI)"
          ERRORS=$(printf '%s\0' "${FILES[@]}" \
            | xargs -0 -r -P "$(nproc)" -n 1 shellcheck --severity=error --format=gcc 2>&1 || true)
          if [[ -n "$ERRORS" ]]; then
            echo "$ERRORS"
            echo "::error::Phát hiện lỗi ShellCheck nghiêm trọng!"
            exit 1
          fi
          echo "✅ Không có error."
          echo "::endgroup::"

      - name: 📝 3. Validate YAML Configuration
        run: |
          python3 -m pip install --disable-pip-version-check "yamllint==1.37.1"
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}, trailing-spaces: disable}}" .github/workflows

      - name: 🔒 4. Kiểm tra Chuỗi cung ứng (Action Pinning)
        shell: bash
        run: |
          set -Eeuo pipefail
          FAILED=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [[ "$trimmed" == "#"* ]] && continue
              
              if [[ "$line" =~ ^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^[:space:]#]+) ]]; then
                action="${BASH_REMATCH[2]}"
                [[ "$action" == ./* || "$action" == docker://* ]] && continue
                
                if [[ ! "$action" =~ @([0-9a-fA-F]{40})$ ]]; then
                  echo "::error file=${file}::BẢO MẬT: Action chưa được ghim SHA 40 ký tự: ${action}"
                  FAILED=1
                fi
              fi
            done < "$file"
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null || true)
          
          if (( FAILED != 0 )); then exit 1; fi

# ============================================================
# JOB 2: QUÉT BẢO MẬT & VỆ SINH REPOSITORY
# ============================================================
  security-scan:
    name: Quét Bảo mật & Vệ sinh Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0 
          persist-credentials: false

      - name: 🛡️ Quét rò rỉ Secret/API (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛑 Quét Code nguy hiểm & Vệ sinh Repo
        shell: bash
        run: |
          set -Eeuo pipefail
          FAILED=0
          
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'curl[^|]*\|[[:space:]]*(ba)?sh' .; then
            echo "::error::Phát hiện mẫu lệnh nguy hiểm (curl pipe to bash)."
            FAILED=1
          fi
          
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'wget[^|]*\|[[:space:]]*(ba)?sh' .; then
            echo "::error::Phát hiện mẫu lệnh nguy hiểm (wget pipe to bash)."
            FAILED=1
          fi

          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'chmod[[:space:]]+(-R[[:space:]]+)?(0)?777([[:space:]]|$)' .; then
            echo "::error::CẢNH BÁO: Phát hiện quyền nguy hiểm 777!"
            FAILED=1
          fi

          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'chmod[[:space:]]+.*o\+w' .; then
            echo "::error::CẢNH BÁO: Cấp quyền ghi cho World-writable (o+w) là không an toàn!"
            FAILED=1
          fi

          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' '^[[:space:]]*set[[:space:]]+-[a-zA-Z]*x' .; then
            echo "::error::Phát hiện lệnh 'set -x'. Xóa ngay để tránh lộ Password trên Logs!"
            FAILED=1
          fi

          SUSPICIOUS_KEYS=$(find . -type d -name .git -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \) ! -name 'wptangtoc-gpg-pub.key' -print)
          if [[ -n "$SUSPICIOUS_KEYS" ]]; then
            echo "::error::Phát hiện tệp tin nhạy cảm (.key, .pem...)!"
            echo "$SUSPICIOUS_KEYS"
            FAILED=1
          fi

          if find . -type d -name .git -prune -o -type f \( -name '*.sql' -o -name '*.sql.gz' -o -name '*.sql.zst' \) -print | grep -q .; then
            echo "::warning::Phát hiện Database Dumps (.sql / .gz / .zst)!"
          fi

          if (( FAILED != 0 )); then exit 1; fi

# ============================================================
# JOB 2B: QUÉT CVE CHUYÊN SÂU VỚI TRIVY
# ============================================================
  cve-scan:
    name: Quét CVE (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: 🛡️ Quét CVE Filesystem (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln,secret'
          skip-dirs: '.git,.github,tests,node_modules,vendor'
          skip-files: '*.sql,*.sql.gz,*.sql.zst,*.key,*.pem'

      - name: 📊 In tóm tắt CVE
        if: always()
        shell: bash
        run: |
          if command -v jq &>/dev/null && [[ -f trivy-results.sarif ]]; then
            jq -r '.runs[].results[]?.level // empty' trivy-results.sarif 2>/dev/null | sort | uniq -c || echo "Không parse được SARIF"
          fi

      - name: 📤 Upload SARIF lên GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'

      - name: 📦 Upload SARIF Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          retention-days: 30

# ============================================================
# JOB 3: INTEGRATION TESTS (UBUNTU MÔI TRƯỜNG THẬT)
# ============================================================
  integration-tests-ubuntu:
    name: Test Install Ubuntu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 50
    steps:
      - name: 📥 Tải mã nguồn test
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: ⚙️ Cài đặt BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: 🚀 Khởi tạo máy chủ WPTangToc OLS
        run: |
          export TERM=xterm
          export CI=true

          curl -sO https://wptangtoc.com/share/wptangtoc-ols
          
          sudo rm -f /sbin/reboot
          echo -e '#!/bin/bash\necho "Đã chặn lệnh reboot trên CI!"' | sudo tee /sbin/reboot
          sudo chmod +x /sbin/reboot
          
          sudo bash wptangtoc-ols --auto
          
          cd $GITHUB_WORKSPACE
          echo "🔄 Đang chép đè mã nguồn từ commit hiện tại vào /etc/wptt/..."
          sudo cp -a ./tool-wptangtoc-ols/. /etc/wptt/
          sudo chmod -R 755 /etc/wptt/
          
          sudo mkdir -p /etc/wptt/tmp
          curl -s https://wptangtoc.com/share/version-wptangtoc-ols.txt | head -1 | grep '\.' | sudo tee /etc/wptt/tmp/wptangtoc-ols-version-main > /dev/null
          
          sudo bash /etc/wptt/domain/wptt-thay-domain-chinh-wptangtoc-ols-com github.wptangtoc.com

      - name: 🛠 Vô hiệu hóa lệnh gọi Menu (Chống treo)
        run: |
          echo -e '#!/bin/bash\nexit 0' | sudo tee /usr/bin/wptangtoc /etc/wptt/wptt-status /etc/wptt/wptt-status2 > /dev/null
          for file in /etc/wptt/wptt-*main; do
            if [ -f "$file" ]; then echo -e '#!/bin/bash\nexit 0' | sudo tee "$file" > /dev/null; fi
          done

      - name: 🛠️ Bypass (Mocking) ionice & nice
        run: |
          cat << 'EOF' | sudo tee /usr/local/bin/ionice > /dev/null
          #!/bin/bash
          while [[ $# -gt 0 ]]; do
            if [[ "$1" != -* ]]; then break; fi
            shift 2
          done
          exec "$@"
          EOF
          sudo cp /usr/local/bin/ionice /usr/local/bin/nice
          sudo chmod +x /usr/local/bin/ionice /usr/local/bin/nice

      - name: 🧪 Chạy Kiểm thử BATS (Cô lập từng file)
        shell: bash
        run: |
          if find tests -type f -name '*.bats' 2>/dev/null | grep -q .; then
            set -o pipefail
            sudo cp /etc/wptt/core-functions /tmp/core-functions-master-backup.sh 2>/dev/null || true
            > bats-test-${{ matrix.os }}.log
            
            for test_file in tests/*.bats; do
              echo -e "\n=== ĐANG CHẠY BÀI TEST: $test_file ===" | tee -a bats-test-${{ matrix.os }}.log
              sudo cp /tmp/core-functions-master-backup.sh /etc/wptt/core-functions 2>/dev/null || true
              sudo bats "$test_file" | tee -a bats-test-${{ matrix.os }}.log
            done
            
            sudo cp /tmp/core-functions-master-backup.sh /etc/wptt/core-functions 2>/dev/null || true
          else
            exit 1
          fi

      - name: 📋 Copy log ra workspace
        if: always()
        run: |
          sudo cp /var/log/wptangtoc-install.log ./wptangtoc-install-${{ matrix.os }}.log 2>/dev/null || true
          sudo chown "$USER:$USER" ./wptangtoc-install-${{ matrix.os }}.log 2>/dev/null || true

      - name: 🔐 Redact thông tin nhạy cảm trong log
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for LOG in ./wptangtoc-install-${{ matrix.os }}.log ./bats-test-${{ matrix.os }}.log; do
            [[ -f "$LOG" ]] || continue
            sudo sed -i -E \
              -e 's/(password|passwd|pwd|secret|token|api_key|apikey)[=:][[:space:]]*"?([^"[:space:]]+)"?/\1=[REDACTED]/gi' \
              -e 's/(-p|--password=)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's#(mysql|https?|ftp)://[^:]+:[^@]+@#\1://[REDACTED]@#gi' \
              "$LOG" 2>/dev/null || true
          done

      - name: 🖨 In Log nếu thất bại
        if: ${{ failure() }}
        run: cat ./wptangtoc-install-${{ matrix.os }}.log || echo "Không có log"

      - name: 📤 Upload Artifacts (Logs Ubuntu)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: logs-${{ matrix.os }}
          path: |
            wptangtoc-install-${{ matrix.os }}.log
            bats-test-${{ matrix.os }}.log
          if-no-files-found: ignore
          retention-days: 7

# ============================================================
# JOB 4: INSTALLATION TESTS (ALMALINUX x86_64) - FULL VM (vmactions)
# ============================================================
  install-tests-almalinux-x86:
    name: Test Install AlmaLinux ${{ matrix.release }} (x86_64)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '9'
            arch: x86_64
            runner: ubuntu-24.04
          - release: '10'
            arch: x86_64
            runner: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: 🚀 Khởi chạy Máy ảo KVM & Test
        uses: vmactions/almalinux-vm@2e94bdbdd43099f80f0270a58b7a98974c40e6dc
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          run: |
            echo "::group::🚀 Khởi tạo máy chủ WPTangToc OLS (Cài đặt hệ thống)"
            export TERM=xterm
            export CI=true
            
            trap 'cp /var/log/wptangtoc-install.log "$GITHUB_WORKSPACE/wptangtoc-install-alma${{ matrix.release }}-${{ matrix.arch }}.log" 2>/dev/null || true' EXIT
            
            dnf install -y epel-release sudo curl
            dnf install -y bats
            curl -sO https://wptangtoc.com/share/wptangtoc-ols
            
            systemctl mask reboot.target halt.target poweroff.target shutdown.target
            
            for cmd in reboot shutdown halt poweroff; do
              rm -f /sbin/$cmd /usr/sbin/$cmd /bin/$cmd /usr/bin/$cmd 2>/dev/null || true
              echo -e '#!/bin/bash\necho "Đã chặn lệnh '$cmd' trên CI/CD!"' > /usr/sbin/$cmd
              chmod +x /usr/sbin/$cmd
              ln -sf /usr/sbin/$cmd /sbin/$cmd 2>/dev/null || true
              ln -sf /usr/sbin/$cmd /bin/$cmd 2>/dev/null || true
              chattr +i /usr/sbin/$cmd 2>/dev/null || true
              chattr +i /sbin/$cmd 2>/dev/null || true
            done

            mv /usr/bin/dnf /usr/bin/dnf_real
            cat << 'EOF' > /usr/bin/dnf
            #!/bin/bash
            if [[ "$1" == "update" || "$1" == "upgrade" ]]; then exit 0; fi
            exec /usr/bin/dnf_real "$@"
            EOF
            chmod +x /usr/bin/dnf
            
            bash wptangtoc-ols --auto
         
            cd $GITHUB_WORKSPACE
            echo "🔄 Đang chép đè mã nguồn từ commit hiện tại vào /etc/wptt/..."
            cp -a ./tool-wptangtoc-ols/. /etc/wptt/
            chmod -R 755 /etc/wptt/
            
            mkdir -p /etc/wptt/tmp
            curl -s https://wptangtoc.com/share/version-wptangtoc-ols.txt | head -1 | grep '\.' > /etc/wptt/tmp/wptangtoc-ols-version-main

            bash /etc/wptt/domain/wptt-thay-domain-chinh-wptangtoc-ols-com github.wptangtoc.com
            
            echo -e '#!/bin/bash\nexit 0' > /usr/bin/wptangtoc
            echo -e '#!/bin/bash\nexit 0' > /etc/wptt/wptt-status
            echo -e '#!/bin/bash\nexit 0' > /etc/wptt/wptt-status2
            for file in /etc/wptt/wptt-*main; do
              if [ -f "$file" ]; then echo -e '#!/bin/bash\nexit 0' > "$file"; fi
            done
            chmod +x /usr/bin/wptangtoc /etc/wptt/wptt-status /etc/wptt/wptt-status2 /etc/wptt/wptt-*main 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::🧪 Chạy Kiểm thử BATS (Cô lập từng file)"
            if find tests -type f -name '*.bats' 2>/dev/null | grep -q .; then 
              set -o pipefail
              cp /etc/wptt/core-functions /tmp/core-functions-master-backup.sh 2>/dev/null || true
              > "$GITHUB_WORKSPACE/bats-test-alma${{ matrix.release }}-${{ matrix.arch }}.log"
              
              for test_file in tests/*.bats; do
                echo -e "\n=== ĐANG CHẠY BÀI TEST: $test_file ===" | tee -a "$GITHUB_WORKSPACE/bats-test-alma${{ matrix.release }}-${{ matrix.arch }}.log"
                cp /tmp/core-functions-master-backup.sh /etc/wptt/core-functions 2>/dev/null || true
                bats "$test_file" | tee -a "$GITHUB_WORKSPACE/bats-test-alma${{ matrix.release }}-${{ matrix.arch }}.log"
              done
              
              cp /tmp/core-functions-master-backup.sh /etc/wptt/core-functions 2>/dev/null || true
            fi
            echo "::endgroup::"

      - name: 🔐 Redact thông tin nhạy cảm trong log
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for LOG in ./wptangtoc-install-alma*.log ./bats-test-alma*.log; do
            [[ -f "$LOG" ]] || continue
            sudo sed -i -E \
              -e 's/(password|passwd|pwd|secret|token|api_key|apikey)[=:][[:space:]]*"?([^"[:space:]]+)"?/\1=[REDACTED]/gi' \
              -e 's/(-p|--password=)[^[:space:]]+/\1[REDACTED]/g' \
              -e 's#(mysql|https?|ftp)://[^:]+:[^@]+@#\1://[REDACTED]@#gi' \
              "$LOG" 2>/dev/null || true
          done

      - name: 🖨️ In Log nếu thất bại
        if: ${{ failure() }}
        run: cat wptangtoc-install-alma${{ matrix.release }}-${{ matrix.arch }}.log || echo "Không có log"

      - name: 📤 Upload Artifacts (Logs AlmaLinux x86)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: logs-almalinux-${{ matrix.release }}-${{ matrix.arch }}
          path: |
            wptangtoc-install-alma*.log
            bats-test-alma*.log
          if-no-files-found: ignore
          retention-days: 7

# ============================================================
# JOB 4B: INSTALLATION TESTS (ALMALINUX ARM) - CHỈ CHẠY HẸN GIỜ
# ============================================================
  install-tests-almalinux-arm:
    name: Test Install AlmaLinux ${{ matrix.release }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '9'
