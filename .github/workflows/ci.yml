name: WPTangToc OLS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: wptangtoc-ols-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
# ============================================================
# JOB 1: KIỂM TRA CÚ PHÁP, CHẤT LƯỢNG CODE & WORKFLOW SECURITY
# ============================================================
  code-quality:
    name: Kiểm tra Cú pháp & ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: 🛠 1. Kiểm tra Cú pháp Bash thuần (Đa luồng)
        run: |
          find . -type d -name ".git" -prune -o -type f \( -name "*.sh" -o ! -name "*.*" \) -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} + | xargs -r -P "$(nproc)" -I {} bash -n {}

      - name: 🔍 2. Chạy ShellCheck
        shell: bash
        env:
          SHELLCHECK_OPTS: "-e SC1091 -e SC1090 -e SC2154 -e SC2102 -e SC2211 -e SC2034"
        run: |
          set -Eeuo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck

          mapfile -t FILES < <(
            find . -type d -name ".git" -prune -o -type f \
              \( -name "*.sh" -o ! -name "*.*" \) \
              -exec awk 'FNR==1 && /^#!.*(bash|sh)/{print FILENAME}' {} +
          )

          if (( ${#FILES[@]} == 0 )); then
            echo "Không tìm thấy file shell nào."
            exit 0
          fi

          echo "::group::📋 Toàn bộ issue (warning + error)"
          printf '%s\0' "${FILES[@]}" | xargs -0 -r -P "$(nproc)" -n 1 shellcheck --severity=warning --format=gcc || true
          echo "::endgroup::"

          echo "::group::🚨 Chỉ ERROR (dùng để gate CI)"
          ERRORS=$(printf '%s\0' "${FILES[@]}" \
            | xargs -0 -r -P "$(nproc)" -n 1 shellcheck --severity=error --format=gcc 2>&1 || true)
          if [[ -n "$ERRORS" ]]; then
            echo "$ERRORS"
            echo "::error::Phát hiện lỗi ShellCheck nghiêm trọng!"
            exit 1
          fi
          echo "✅ Không có error."
          echo "::endgroup::"

      - name: 📝 3. Validate YAML Configuration
        run: |
          python3 -m pip install --disable-pip-version-check "yamllint==1.37.1"
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}, trailing-spaces: disable}}" .github/workflows

      - name: 🔒 4. Kiểm tra Chuỗi cung ứng (Action Pinning)
        shell: bash
        run: |
          set -Eeuo pipefail
          FAILED=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [[ "$trimmed" == "#"* ]] && continue
              
              if [[ "$line" =~ ^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*([^[:space:]#]+) ]]; then
                action="${BASH_REMATCH[2]}"
                [[ "$action" == ./* || "$action" == docker://* ]] && continue
                
                if [[ ! "$action" =~ @([0-9a-fA-F]{40})$ ]]; then
                  echo "::error file=${file}::BẢO MẬT: Action chưa được ghim SHA 40 ký tự: ${action}"
                  FAILED=1
                fi
              fi
            done < "$file"
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null || true)
          
          if (( FAILED != 0 )); then exit 1; fi

# ============================================================
# JOB 2: QUÉT BẢO MẬT & VỆ SINH REPOSITORY
# ============================================================
  security-scan:
    name: Quét Bảo mật & Vệ sinh Repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write 
    steps:
      - name: 📥 Tải mã nguồn (Full History)
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0 
          persist-credentials: false

      - name: 🛡️ Quét rò rỉ Secret/API (Gitleaks v3)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛑 Quét Code nguy hiểm & Vệ sinh Repo
        shell: bash
        run: |
          set -Eeuo pipefail
          FAILED=0
          
          echo "::group::Quét Shell Patterns nguy hiểm"
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'curl[^|]*\|[[:space:]]*(ba)?sh' .; then
            echo "::error::Phát hiện mẫu lệnh nguy hiểm (curl pipe to bash)."
            FAILED=1
          fi
          
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'wget[^|]*\|[[:space:]]*(ba)?sh' .; then
            echo "::error::Phát hiện mẫu lệnh nguy hiểm (wget pipe to bash)."
            FAILED=1
          fi

          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'chmod[[:space:]]+(-R[[:space:]]+)?(0)?777([[:space:]]|$)' .; then
            echo "::error::CẢNH BÁO: Phát hiện quyền nguy hiểm 777. Hãy dùng 755 hoặc 644!"
            FAILED=1
          fi

          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' 'chmod[[:space:]]+.*o\+w' .; then
            echo "::error::CẢNH BÁO: Cấp quyền ghi cho World-writable (o+w) là không an toàn!"
            FAILED=1
          fi
          echo "::endgroup::"

          echo "::group::Quét Anti-Log-Leak"
          if grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.bats' '^[[:space:]]*set[[:space:]]+-[a-zA-Z]*x' .; then
            echo "::error::Phát hiện lệnh 'set -x'. Xóa ngay để tránh lộ Password trên GitHub Logs!"
            FAILED=1
          fi
          echo "::endgroup::"

          echo "::group::Quét Vệ sinh Repository"
          SUSPICIOUS_KEYS=$(find . -type d -name .git -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \) ! -name 'wptangtoc-gpg-pub.key' -print)
          
          if [[ -n "$SUSPICIOUS_KEYS" ]]; then
            echo "::error::Cảnh báo: Phát hiện tệp tin có đuôi mở rộng nhạy cảm (.key, .pem...)!"
            echo "$SUSPICIOUS_KEYS"
            FAILED=1
          fi

          if find . -type d -name .git -prune -o -type f \( -name '*.sql' -o -name '*.sql.gz' -o -name '*.sql.zst' \) -print | grep -q .; then
            echo "::warning::Phát hiện Database Dumps (.sql / .gz / .zst)!"
          fi
          echo "::endgroup::"

          if (( FAILED != 0 )); then exit 1; fi

# ============================================================
# JOB 3: INTEGRATION TESTS (UBUNTU MÔI TRƯỜNG THẬT)
# ============================================================
  integration-tests:
    name: Test Install Ubuntu và Kiểm thử BATS
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 📥 Tải mã nguồn test
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: ⚙️ Cài đặt BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: 🚀 Khởi tạo máy chủ WPTangToc OLS
        run: |
          export TERM=xterm
          export CI=true

          curl -sO https://wptangtoc.com/share/wptangtoc-ols
          
          sudo rm -f /sbin/reboot
          echo -e '#!/bin/bash\necho "Đã chặn lệnh reboot thành công để tiếp tục chạy BATS!"' | sudo tee /sbin/reboot
          sudo chmod +x /sbin/reboot
          
          sudo sh -c 'echo "" > /root/.bashrc'
          sudo bash wptangtoc-ols --auto
 
          cd $GITHUB_WORKSPACE
          
          sudo chmod -R 755 /etc/wptt/
          
          sudo mkdir -p /etc/wptt/tmp
          curl -s https://wptangtoc.com/share/version-wptangtoc-ols.txt | head -1 | grep '\.' | sudo tee /etc/wptt/tmp/wptangtoc-ols-version-main > /dev/null

          sudo sh -c 'echo "" > /root/.bashrc'
          
          sudo bash /etc/wptt/domain/wptt-thay-domain-chinh-wptangtoc-ols-com gihub.wptangtoc.com

      - name: 🖨️ In Log cài đặt nếu thất bại
        if: ${{ failure() }}
        run: cat /var/log/wptangtoc-install.log || echo "Không tìm thấy file log"

      - name: 🛠️️ Vô hiệu hóa lệnh gọi Menu (Chống treo BATS)
        run: |
          echo -e '#!/bin/bash\nexit 0' | sudo tee /usr/bin/wptangtoc > /dev/null
          echo -e '#!/bin/bash\nexit 0' | sudo tee /etc/wptt/wptt-status > /dev/null
          echo -e '#!/bin/bash\nexit 0' | sudo tee /etc/wptt/wptt-status2 > /dev/null

          for file in /etc/wptt/wptt-*main; do
            if [ -f "$file" ]; then
              echo -e '#!/bin/bash\nexit 0' | sudo tee "$file" > /dev/null
            fi
          done

      - name: 🛠️ Bypass (Mocking) công cụ ionice và nice cho CI/CD
        run: |
          cat << 'EOF' | sudo tee /usr/local/bin/ionice > /dev/null
          #!/bin/bash
          while [[ $# -gt 0 ]]; do
            if [[ "$1" != -* ]]; then break; fi
            shift 2
          done
          exec "$@"
          EOF

          sudo cp /usr/local/bin/ionice /usr/local/bin/nice
          sudo chmod +x /usr/local/bin/ionice /usr/local/bin/nice

      - name: 🧪 Chạy Kiểm thử BATS Integration
        shell: bash
        run: |
          if find tests -type f -name '*.bats' 2>/dev/null | grep -q .; then
            sudo bats tests/
          else
            exit 1
          fi

# ============================================================
# JOB 4: INSTALLATION TESTS (ALMALINUX VM MATRIX)
# ============================================================
  install-tests-almalinux:
    name: Test Install AlmaLinux ${{ matrix.release }} và Kiểm thử BATS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['9', '10']
    timeout-minutes: 40
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: 🚀 Khởi chạy Máy ảo AlmaLinux & Test Cài đặt và BATS
        uses: vmactions/almalinux-vm@f064f3e6615e3eaf053d727d3f6deb05a821fddf
        with:
          release: ${{ matrix.release }}
          usesh: true
          run: |
            export TERM=xterm
            export CI=true
            
            dnf install -y epel-release sudo curl
            dnf install -y bats

            curl -sO https://wptangtoc.com/share/wptangtoc-ols
            
            systemctl mask reboot.target halt.target poweroff.target shutdown.target
            
            for cmd in reboot shutdown halt poweroff; do
              rm -f /sbin/$cmd /usr/sbin/$cmd /bin/$cmd /usr/bin/$cmd 2>/dev/null || true
              echo -e '#!/bin/bash\necho "Đã chặn lệnh '$cmd' trên CI/CD!"' > /usr/sbin/$cmd
              chmod +x /usr/sbin/$cmd
              ln -sf /usr/sbin/$cmd /sbin/$cmd 2>/dev/null || true
              ln -sf /usr/sbin/$cmd /bin/$cmd 2>/dev/null || true
              chattr +i /usr/sbin/$cmd 2>/dev/null || true
              chattr +i /sbin/$cmd 2>/dev/null || true
            done

            mv /usr/bin/dnf /usr/bin/dnf_real
            cat << 'EOF' > /usr/bin/dnf
            #!/bin/bash
            if [[ "$1" == "update" || "$1" == "upgrade" ]]; then
                echo "CI/CD: Đã bỏ qua dnf update để bảo vệ kết nối SSH!"
                exit 0
            fi
            exec /usr/bin/dnf_real "$@"
            EOF
            chmod +x /usr/bin/dnf
            
            echo "" > /root/.bashrc
            
            bash wptangtoc-ols --auto
         
            cd $GITHUB_WORKSPACE
            
            chmod -R 755 /etc/wptt/
            
            mkdir -p /etc/wptt/tmp
            curl -s https://wptangtoc.com/share/version-wptangtoc-ols.txt | head -1 | grep '\.' > /etc/wptt/tmp/wptangtoc-ols-version-main

            echo "" > /root/.bashrc
            
            bash /etc/wptt/domain/wptt-thay-domain-chinh-wptangtoc-ols-com gihub.wptangtoc.com
            
            echo "✅ Cài đặt thành công trên AlmaLinux ${{ matrix.release }}!"

            echo "🛠️ Đang vô hiệu hóa Menu để chuẩn bị chạy BATS..."
            echo -e '#!/bin/bash\nexit 0' > /usr/bin/wptangtoc
            echo -e '#!/bin/bash\nexit 0' > /etc/wptt/wptt-status
            echo -e '#!/bin/bash\nexit 0' > /etc/wptt/wptt-status2
            for file in /etc/wptt/wptt-*main; do
              if [ -f "$file" ]; then echo -e '#!/bin/bash\nexit 0' > "$file"; fi
            done
            chmod +x /usr/bin/wptangtoc /etc/wptt/wptt-status /etc/wptt/wptt-status2 /etc/wptt/wptt-*main 2>/dev/null || true

            echo "🧪 Đang chạy BATS Integration Tests trên AlmaLinux ${{ matrix.release }}..."
            if find tests -type f -name '*.bats' 2>/dev/null | grep -q .; then
              bats tests/
            else
              echo "Không tìm thấy file test (.bats). Bỏ qua."
              exit 1
            fi

      - name: 🖨️ In Log cài đặt nếu thất bại
        if: ${{ failure() }}
        run: cat /var/log/wptangtoc-install.log || echo "Không tìm thấy file log"
