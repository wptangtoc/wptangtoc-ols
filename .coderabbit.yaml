language: "vi-VN"

tone_instructions: >-
  Trả lời bằng tiếng Việt, rõ ràng và trực tiếp.
  Giải thích ngắn gọn vấn đề và cách khắc phục;
  giữ nguyên tên biến, hàm và thuật ngữ khi cần.

reviews:
  profile: "assertive"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Ưu tiên lỗi logic, bảo mật, mất dữ liệu và tương thích ngược.
        Nêu tình huống gây lỗi, tác động và đề xuất sửa cụ thể.
        Khi kết luận phụ thuộc vào giả định, hãy nói rõ giả định đó.
        Tránh đề xuất thay đổi định dạng đã được formatter xử lý.