# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: "vi-VN"

tone_instructions: >-
  Trả lời bằng tiếng Việt, rõ ràng, trực tiếp và tôn trọng.
  Giải thích ngắn gọn lỗi, tác động và cách sửa; giữ nguyên tên biến,
  hàm, lệnh và thuật ngữ kỹ thuật khi cần.

reviews:
  profile: "assertive"
  path_instructions:
    # Quy tắc chung áp dụng cả cho các script Bash không có đuôi .sh.
    - path: "**/*"
      instructions: >-
        WPTangToc OLS là bộ cài đặt và quản trị máy chủ WordPress dùng Bash,
        OpenLiteSpeed, LSPHP và MariaDB. Script quản trị thường chạy bằng root;
        tool-wptangtoc-ols-user chạy trong phạm vi tài khoản website/chroot.
        Đối chiếu README.md, SECURITY.md, script gọi và tests trước khi kết luận.
        Ưu tiên mất dữ liệu, thực thi lệnh trái phép, vượt quyền, rò rỉ bí mật,
        gián đoạn dịch vụ và lỗi tương thích. Nêu vị trí, điều kiện gây lỗi,
        tác động, bằng chứng từ luồng thực thi và cách sửa nhỏ nhất phù hợp.
        Phân biệt lỗi có bằng chứng với câu hỏi cần xác minh; nói rõ giả định.
        Theo dõi đầu vào domain, user, đường dẫn và dữ liệu mạng đến thao tác
        shell, SQL, sed, cấu hình hoặc xóa file. Kiểm tra quoting, option injection,
        path traversal, symlink, file tạm và việc source file có thể bị ghi bởi user.
        Với thao tác phá hủy, kiểm tra phạm vi đích, xác thực đầu vào, xác nhận
        khi phù hợp và phục hồi khi thất bại. Kiểm tra exit status, pipeline,
        timeout, xử lý lỗi giữa chừng, chạy lại và chạy đồng thời/cron.
        Không đề xuất bật strict mode hàng loạt khi chưa xét script được source,
        biến dùng chung và luồng menu. Không yêu cầu đổi tên tiếng Việt hay
        refactor/định dạng thuần phong cách; vẫn báo lỗi quoting có tác động thật.
        Khi thay đổi script được đóng gói, đối chiếu workflow phát hành và nội dung
        ZIP/checksum/chữ ký liên quan; không yêu cầu ký lại mọi artifact cho mọi PR.

    - path: "{wptangtoc-ols,wptangtoc-ols-almalinux,wptangtoc-ols-almalinux-9,wptangtoc-ols-almalinux-10,wptangtoc-ols-ubuntu,update,tool-wptangtoc-ols/*update*,tool-wptangtoc-ols/update/**}"
      instructions: >-
        Review luồng cài đặt/nâng cấp với quyền root. Đối chiếu từng nhánh hệ điều
        hành theo README: AlmaLinux/Rocky/RHEL/Oracle 8, 9, 10; Ubuntu 22.04, 24.04
        và kiến trúc x86_64/ARM64. Kiểm tra package manager, tên gói, repository,
        service và binary đúng nền tảng; giữ cấu hình/dữ liệu đang có khi nâng cấp.
        Chế độ --auto không được treo chờ nhập hoặc tự mở rộng phạm vi xóa dữ liệu.
        Mọi nguồn tải chính/dự phòng phải giữ xác thực HTTPS, GPG và SHA256 tại
        các bước yêu cầu xác thực; lỗi xác thực phải ngăn thực thi artifact.
        Kiểm tra fingerprint/signer tin cậy, kết quả tải, file rỗng/tải thiếu,
        giải nén an toàn và đổi bản cài đặt sau khi xác thực thành công.
        Với phân vùng/LVM, kiểm tra backup thực sự thành công trước khi xóa,
        mount/fstab, xử lý thất bại và khả năng khôi phục.

    - path: "tool-wptangtoc-ols/**"
      instructions: >-
        Theo dõi các file được triển khai vào /etc/wptt và script caller/menu.
        Kiểm tra đường dẫn /usr/local/lsws, cấu hình vhost và biến domain/user
        đúng website; không cho đầu vào website điều khiển thao tác root tùy ý.
        Kiểm tra thư viện core-functions, biến được source và exit/return/exec
        theo ngữ cảnh caller; bảo toàn luồng menu và mã thoát khi có lỗi.
        Phân biệt host với chroot, UID/GID, socket và quyền sở hữu file.
        Khi chức năng tương ứng có ở tool-wptangtoc-ols-user, kiểm tra ảnh hưởng
        đến bản user nhưng không yêu cầu hai bản giống nhau về quyền quản trị.

    - path: "tool-wptangtoc-ols-user/**"
      instructions: >-
        Đây là công cụ dành cho user website/chroot. Kiểm tra ranh giới quyền:
        chỉ truy cập file, database, socket và backup được cấp cho user hiện tại.
        Không tin domain/user/path do người dùng cung cấp để xác định quyền sở hữu.
        Kiểm tra symlink, đường dẫn thoát chroot và lệnh phụ thuộc root/systemctl
        hoặc đường dẫn chỉ có trên host. So sánh chức năng tương ứng ở bản quản trị
        để phát hiện lệch logic; giữ giới hạn quyền của bản user.

    - path: "{wptt,tool-wptangtoc-ols{,-user}/{backup-restore,db,chuyen-web}/**,tool-wptangtoc-ols/add-one/{sao-luu-telegram,restore-telegram}.sh}"
      instructions: >-
        Kiểm tra backup gồm mã nguồn, database và cấu hình cần thiết, có trạng thái
        thành công thực sự và tính nhất quán dữ liệu trước khi báo hoàn tất/xóa bản cũ.
        Xét hết dung lượng, lỗi dump/nén/upload, mất mạng, giải mã sai và backup hỏng.
        Restore phải kiểm tra archive, checksum khi có, path traversal/symlink,
        đúng domain/database đích và quyền file; không phá dữ liệu hiện tại trước
        khi xác thực đầu vào và có phương án phục hồi phù hợp.
        Kiểm tra SQL/identifier injection, bảo vệ mật khẩu/khóa mã hóa/token cloud,
        xử lý tên database và tương thích phiên bản MariaDB khi import/nâng cấp.
        Kiểm tra khóa chống chạy đồng thời, retention chỉ xóa đúng backup thuộc
        phạm vi quản lý, dọn file tạm và gỡ maintenance mode cả khi lỗi.

    - path: "tool-wptangtoc-ols/{domain,ssl,php,cau-hinh,wordpress,gia-lap-website}/**"
      instructions: >-
        Kiểm tra domain/vhost/listener/document root và cấu hình được sinh cho
        OpenLiteSpeed/LSPHP. Xác thực cấu hình trước reload/restart khi có công cụ
        hỗ trợ; lỗi không được làm hỏng website khác hoặc mất cấu hình đang chạy.
        Giữ cô lập PhpSuExec/chroot/namespace, UID/GID và quyền socket/file.
        Với SSL, kiểm tra đúng domain/SAN, private key, ACME challenge, gia hạn,
        hết hạn và Cloudflare; không tắt xác thực TLS để che lỗi kết nối.
        Với WordPress/WP-CLI, kiểm tra user thực thi, database/prefix/URL và
        thay URL khi clone/migrate, gồm dữ liệu serialized; tránh lộ wp-config.
        Kiểm tra thay đổi cron/rewrite/.htaccess không làm hỏng đăng nhập,
        permalink, trang quản trị hay chạy tác vụ trùng lặp.

    - path: "tool-wptangtoc-ols{,-user}/cache/**"
      instructions: >-
        Kiểm tra page cache/object cache/OPcache đúng tầng và đúng website.
        Không cache nội dung cá nhân, phiên đăng nhập, giỏ hàng/checkout WooCommerce
        hoặc trộn cache giữa domain/user. Xét cookie, query string, cache key,
        invalidation/purge, quyền và xác thực Redis/Memcached/Valkey/KeyDB/socket.
        Preload cần timeout, giới hạn đồng thời/tài nguyên và tránh vòng lặp URL;
        lỗi backend cache không được làm hỏng luồng phục vụ website.

    - path: "tool-wptangtoc-ols/{bao-mat,fail2ban,ssh}/**"
      instructions: >-
        Kiểm tra firewall/nftables/Fail2ban/XDP giữ kết nối SSH quản trị,
        lưu lượng đang hoạt động, DNS, HTTP/HTTPS/QUIC và ACME theo chức năng.
        Xét thứ tự rule, IPv4/IPv6, allowlist Cloudflare/Google và việc tin proxy
        header chỉ từ proxy tin cậy. Lỗi tải danh sách IP hoặc rule sai không được
        âm thầm xóa bảo vệ hiện tại; xét kiểm tra cú pháp, cập nhật và rollback.
        Với C/Go XDP/eBPF, kiểm tra giới hạn packet/buffer, byte order, map key,
        đồng bộ map giữa chương trình và loader, cleanup và tương thích kernel/NIC.
        Tránh false positive khóa nhầm user/IP hợp lệ hoặc gây CPU/RAM tăng mất kiểm soát.

    - path: "{tool-wptangtoc-ols/{disk,swap,tai-nguyen-server,service}/**,tool-wptangtoc-ols/{zram,disk-optimize,*swap*,*phanquyen*,*namespace*}}"
      instructions: >-
        Kiểm tra tuning dựa trên RAM/CPU/disk thực tế, đơn vị đo và trường hợp máy
        nhỏ; tổng ngân sách MariaDB/PHP/cache/swap không được gây OOM hoặc thrashing.
        Kiểm tra thay đổi mount, swap, sysctl, ownership và service có đúng phạm vi,
        chạy lại an toàn và giữ dữ liệu/cấu hình. Watcher/auto-restart cần phân biệt
        dịch vụ đang lỗi với dừng có chủ ý, tránh restart loop và cron trùng lặp.

    - path: "tests/**/*.bats"
      instructions: >-
        Kiểm thử phải xác nhận hành vi và dữ liệu/quyền sau thao tác, không chỉ
        chuỗi log thành công. Với thao tác nguy hiểm, cần ca input rỗng/sai,
        thất bại giữa chừng, vượt quyền và giữ nguyên dữ liệu ngoài phạm vi khi phù hợp.
        Fixture/domain/user tách biệt; teardown khôi phục file/service bị sửa cả
        khi test lỗi. Skip do thiếu môi trường không chứng minh chức năng đã pass.
        Đối chiếu các script thực sự chạy và matrix trong CI; tránh test vô tình
        dùng bản tải từ mạng khác với code PR hoặc đụng dữ liệu máy chủ có sẵn.

    - path: ".github/workflows/**"
      instructions: >-
        Kiểm tra Actions ghim full commit SHA, permissions tối thiểu theo job,
        secrets/log/artifact và input PR không bị chèn vào shell hay chạy với quyền cao.
        Giữ các gate Bash syntax, ShellCheck, YAML, Gitleaks, vệ sinh repo,
        action pinning và quét Trivy; phân biệt scan cảnh báo với gate chặn merge.
        Kiểm tra matrix hệ điều hành/kiến trúc thực tế, test code PR, cleanup,
        timeout và việc bỏ qua test không làm báo thành công sai.
        Với phát hành, đối chiếu ZIP, version, SHA256SUMS và chữ ký GPG để đảm bảo
        artifact khớp nguồn và không đưa private key vào repository/artifact.
