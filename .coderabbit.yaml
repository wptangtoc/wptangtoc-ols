language: "vi-VN"

tone_instructions: >-
  Luôn trả lời bằng tiếng Việt trong review và hội thoại, gồm tóm tắt,
  giải thích lỗi, Merge Risk và Security Architecture Review.
  Viết ngắn gọn, rõ ràng. Giữ nguyên tên biến, hàm, lệnh và đường dẫn.

reviews:
  profile: "assertive"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Viết nhận xét, giải thích và đề xuất sửa bằng tiếng Việt.
        Ưu tiên lỗi logic, bảo mật, mất dữ liệu và tương thích ngược.
        Nêu điều kiện gây lỗi, tác động và cách sửa cụ thể.
        Chỉ kết luận khi có bằng chứng từ mã nguồn;
        nếu phụ thuộc giả định, hãy nói rõ giả định đó.
        Tránh góp ý thuần định dạng đã được formatter xử lý.

